name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins (no silent upgrades).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (security and correctness rules)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Only what ships matters here; the dev toolchain is reported but does not block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev toolchain (informational)
        run: npm audit --audit-level=critical || true

      - name: Build
        run: npm run build
